<link rel="stylesheet" href="style.css">
<style>
  .wip-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .wip-icon {
    font-size: 3.5rem;
    margin-bottom: 20px;
    animation: wipBounce 2s ease-in-out infinite;
  }
  @keyframes wipBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  .wip-wrap h1 {
    font-size: 2rem;
    margin-bottom: 12px;
  }
  .wip-wrap p {
    color: var(--muted);
    max-width: 420px;
    margin-bottom: 28px;
  }
</style>
</head>
